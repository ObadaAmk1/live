<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سينما الأصدقاء</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #080808;
            --panel-bg: #141414;
            --text: #ffffff;
            --primary: #e50914;
            --success: #28a745;
            --border: #333;
        }
        body {
            margin: 0;
            padding: 10px;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .panel {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }
        h2, h3 { margin-top: 0; }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-main { background-color: var(--primary); color: white; }
        .btn-secondary { background-color: var(--border); color: white; }
        .btn-active { background-color: #fca311; color: black; }
        #roomUrlInput {
            width: 100%;
            padding: 12px;
            background: #000;
            color: var(--success);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-top: 15px;
            font-family: monospace;
            text-align: center;
            display: none;
        }
        .status { font-size: 0.9em; color: #888; margin-top: 10px; }
        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            aspect-ratio: 16/9;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #playOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #playOverlay button {
            font-size: 1.4em;
            padding: 20px 40px;
            background-color: var(--success);
        }
        @media (max-width: 600px) {
            button { width: 100%; justify-content: center; }
            h2 { font-size: 1.5em; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="panel">
        <h2>🎬 سينما الأصدقاء</h2>
        <div class="status" id="statusTxt">جاري الاتصال بالسيرفر...</div>

        <!-- لوحة التحكم -->
        <div class="controls" id="controlsPanel" style="display:none;">
            <!-- أدوات المضيف -->
            <button class="btn-main" id="startBtn" onclick="createRoomAndStart()">
                <span>Create</span> إنشاء غرفة وبدء البث
            </button>
            <button class="btn-secondary" id="hostMicBtn" onclick="toggleHostMic()" style="display:none;">
                🎤 إيقاف مايك المضيف
            </button>
            
            <!-- أدوات المشاهد -->
            <button class="btn-active" id="viewerMicBtn" onclick="toggleViewerMic()" style="display:none;">
                🎤 تشغيل مايكروفوني للتحدث
            </button>
        </div>

        <!-- رابط الغرفة (للمضيف) -->
        <input type="text" id="roomUrlInput" readonly onclick="this.select(); document.execCommand('copy'); alert('تم نسخ الرابط! أرسله لصديقك.');">
    </div>

    <!-- شاشة العرض -->
    <div class="video-container">
        <!-- زر التشغيل الإجباري (حل الشاشة السوداء في الموبايل) -->
        <div id="playOverlay">
            <h3 style="color: white; margin-bottom: 20px;">البث جاهز للمشاهدة</h3>
            <button onclick="playVideo()">▶️ تشغيل السينما</button>
        </div>
        <video id="mainVideo" playsinline controls></video>
    </div>
</div>

<script>
    const peer = new Peer();
    const mainVideo = document.getElementById('mainVideo');
    const statusTxt = document.getElementById('statusTxt');
    const controlsPanel = document.getElementById('controlsPanel');
    const startBtn = document.getElementById('startBtn');
    const hostMicBtn = document.getElementById('hostMicBtn');
    const viewerMicBtn = document.getElementById('viewerMicBtn');
    const roomUrlInput = document.getElementById('roomUrlInput');
    const playOverlay = document.getElementById('playOverlay');

    let localStream;
    let localMicTrack;
    let peerConnection;
    let isHost = false;

    // عند الاتصال بالسيرفر بنجاح
    peer.on('open', (id) => {
        statusTxt.innerText = "متصل وجاهز للبدء.";
        statusTxt.style.color = "#28a745";
        controlsPanel.style.display = 'flex';

        // تحقق مما إذا كنت دخلت عبر رابط غرفة
        const hostId = window.location.hash.substring(1);
        if (hostId) {
            joinRoom(hostId);
        }
    });

    // ==========================================
    // 1. أكواد المضيف (Host)
    // ==========================================
    async function createRoomAndStart() {
        try {
            statusTxt.innerText = "جاري التقاط شاشة الفيلم والمايكروفون...";
            
            // 1. التقاط المايكروفون (لضمان عمل محرك الصوت قبل أي شيء)
            const micStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true },
                video: false
            });
            localMicTrack = micStream.getAudioTracks()[0];

            // 2. التقاط شاشة نتفليكس بالصوت الخام (MUST CHOOSE CHROME TAB)
            const displayStream = await navigator.mediaDevices.getDisplayMedia({
                video: { width: 1280, height: 720 },
                audio: { echoCancellation: false, noiseSuppression: false }
            });

            // دمج الصوت يدوياً باستخدام AudioContext (الطريقة المستقرة)
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const dest = audioContext.createMediaStreamDestination();
            
            if(displayStream.getAudioTracks().length > 0){
                audioContext.createMediaStreamSource(displayStream).connect(dest);
            }
            audioContext.createMediaStreamSource(micStream).connect(dest);

            // البث النهائي (فيديو الشاشة + الصوت المدمج)
            localStream = new MediaStream([
                displayStream.getVideoTracks()[0],
                dest.stream.getAudioTracks()[0]
            ]);

            // عرض البث محلياً
            mainVideo.srcObject = localStream;
            mainVideo.muted = true; // نكتمه عندك عشان ما تسمع صدى نفسك
            mainVideo.play();

            isHost = true;
            statusTxt.innerText = "البث جاهز! انسخ الرابط في الأسفل وأرسله لصديقك.";
            statusTxt.style.color = "#4CAF50";
            
            startBtn.style.display = 'none';
            hostMicBtn.style.display = 'flex';
            
            // إنشاء رابط الغرفة باستخدام الـ Hash
            const roomUrl = window.location.href + "#" + peer.id;
            roomUrlInput.value = roomUrl;
            roomUrlInput.style.display = 'block';

            // الاستماع لاتصال صديقك
            peer.on('call', (call) => {
                call.answer(localStream); // الرد وإرسال البث له
            });

        } catch (error) {
            console.error(error);
            alert("فشل بدء البث. تأكد من منح الصلاحيات واختيار علامة تبويب للمشاركة.");
            statusTxt.innerText = "حدث خطأ في بدء البث.";
            statusTxt.style.color = "#e50914";
        }
    }

    function toggleHostMic() {
        if (localMicTrack) {
            localMicTrack.enabled = !localMicTrack.enabled;
            hostMicBtn.innerText = localMicTrack.enabled ? "🎤 إيقاف مايك المضيف" : "🔇 تشغيل مايك المضيف";
            hostMicBtn.className = localMicTrack.enabled ? "btn-secondary" : "btn-secondary btn-active";
        }
    }

    // ==========================================
    // 2. أكواد المشاهد (Viewer)
    // ==========================================
    async function joinRoom(hostId) {
        isHost = false;
        statusTxt.innerText = "جاري الاتصال بغرفة المضيف...";
        statusTxt.style.color = "#fca311";
        startBtn.style.display = 'none';

        // المشاهد يتصل أولاً بـ "صمت" لضمان جودة صوت الفيلم
        const call = peer.call(hostId, new MediaStream());
        
        call.on('stream', (remoteStream) => {
            statusTxt.innerText = "متصل ويتم الآن استقبال البث.";
            statusTxt.style.color = "#4CAF50";
            mainVideo.srcObject = remoteStream;
            
            // إظهار زر التشغيل الإجباري لحل مشكلة المتصفحات
            playOverlay.style.display = 'flex';
            viewerMicBtn.style.display = 'flex';
        });

        call.on('error', (err) => {
            alert("حدث خطأ في الاتصال بالبث.");
            console.error(err);
        });
    }

    // المشاهد يقرر تشغيل مايكروفونه
    async function toggleViewerMic() {
        try {
            if (!localMicTrack) {
                // التقاط المايك لأول مرة
                const micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                localMicTrack = micStream.getAudioTracks()[0];
                
                // في نظام Peer-to-Peer لا يمكن إضافة مسار بعد بدء المكالمة بسهولة
                // أفضل طريقة هي "إعادة الاتصال" ولكن بإرسال المايك
                const hostId = window.location.hash.substring(1);
                peer.call(hostId, micStream); 
                
                viewerMicBtn.innerText = "🎤 إيقاف مايكروفوني";
                viewerMicBtn.className = "btn-main";
                alert("تم تشغيل المايكروفون. يرجى استخدام سماعات الأذن لتجنب الصدى.");
            } else {
                localMicTrack.enabled = !localMicTrack.enabled;
                viewerMicBtn.innerText = localMicTrack.enabled ? "🎤 إيقاف مايكروفوني" : "🔇 تشغيل مايكروفوني";
                viewerMicBtn.className = localMicTrack.enabled ? "btn-main" : "btn-active";
            }
        } catch (err) {
            alert("لا يمكن الوصول للمايكروفون.");
        }
    }

    // دالة النقر الإجبارية لتشغيل الفيديو (تحل مشكلة الشاشة السوداء)
    function playVideo() {
        mainVideo.play().then(() => {
            playOverlay.style.display = 'none';
        }).catch(err => {
            alert("حدث خطأ في تشغيل الفيديو، تأكد من أن المضيف يشارك شاشة.");
        });
    }
</script>
</body>
</html>
