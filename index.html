<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- هذا السطر لجعل الموقع متوافقاً مع الهواتف -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة مشاهدة الأفلام</title>
    <!-- استدعاء مكتبة PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #ffffff;
            --primary: #e50914; /* لون نتفليكس */
            --primary-hover: #b20710;
        }
        body {
            margin: 0;
            padding: 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .header {
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .connection-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            justify-content: center;
            align-items: center;
        }
        input {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #2b2b2b;
            color: white;
            flex-grow: 1;
            min-width: 200px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: var(--primary);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            flex-grow: 1;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .video-container {
            position: relative;
            width: 100%;
            background: black;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16/9; /* يحافظ على أبعاد الشاشة */
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #myIdDisplay {
            color: #4CAF50;
            font-weight: bold;
            user-select: all;
            background: #000;
            padding: 5px 10px;
            border-radius: 4px;
        }
        /* تعديلات للهواتف */
        @media (max-width: 600px) {
            .connection-panel, .controls {
                flex-direction: column;
            }
            button, input {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🍿 غرفة مشاهدة الأفلام</h2>
        <p>الـ ID الخاص بك: <span id="myIdDisplay">جاري الاتصال بالسيرفر...</span></p>
    </div>

    <!-- لوحة الاتصال -->
    <div class="connection-panel">
        <input type="text" id="friendIdInput" placeholder="أدخل ID صديقك هنا للاتصال به">
        <button onclick="connectToFriend()">مشاهدة البث (لصديقك)</button>
    </div>

    <!-- أدوات التحكم (لك كمضيف) -->
    <div class="controls">
        <button onclick="startStreaming()" style="background-color: #4CAF50;">بدء بث الفيلم (للمضيف)</button>
        <button id="micBtn" onclick="toggleMic()">إيقاف المايك 🎤</button>
    </div>

    <!-- شاشة العرض -->
    <div class="video-container">
        <video id="mainVideo" autoplay playsinline controls></video>
    </div>
</div>

<script>
    // تهيئة PeerJS باستخدام سيرفرهم المجاني
    const peer = new Peer();
    let myStream;
    let myAudioTrack;
    
    const mainVideo = document.getElementById('mainVideo');
    const myIdDisplay = document.getElementById('myIdDisplay');
    const friendIdInput = document.getElementById('friendIdInput');
    const micBtn = document.getElementById('micBtn');

    // عندما يتم تخصيص ID لك بنجاح
    peer.on('open', (id) => {
        myIdDisplay.innerText = id;
    });

    // 1. دالة بدء البث (أنت كمضيف تضغط عليها)
    async function startStreaming() {
        try {
            // التقاط شاشة نتفليكس بالصوت الخام (بدون فلاتر)
            const displayStream = await navigator.mediaDevices.getDisplayMedia({
                video: true,
                audio: {
                    echoCancellation: false,
                    noiseSuppression: false, // الصوت خام
                    autoGainControl: false,
                    sampleRate: 48000
                }
            });

            // التقاط المايكروفون الخاص بك
            const micStream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true
                }
            });

            myAudioTrack = micStream.getAudioTracks()[0];

            // دمج صوت الفيلم مع صوت المايكروفون في مسار واحد
            const audioContext = new AudioContext();
            const dest = audioContext.createMediaStreamDestination();
            
            if(displayStream.getAudioTracks().length > 0){
                audioContext.createMediaStreamSource(displayStream).connect(dest);
            }
            audioContext.createMediaStreamSource(micStream).connect(dest);

            // إنشاء البث النهائي (فيديو الشاشة + الصوت المدمج)
            myStream = new MediaStream([
                displayStream.getVideoTracks()[0],
                dest.stream.getAudioTracks()[0]
            ]);

            // عرض البث لك للتأكد
            mainVideo.srcObject = myStream;
            mainVideo.muted = true; // نكتم الصوت عندك عشان ما تسمع صدى نفسك

            alert("البث جاهز! أعطِ الـ ID الخاص بك لصديقك.");

            // الاستماع لأي اتصال قادم من صديقك
            peer.on('call', (call) => {
                // الرد على الاتصال وإرسال البث له
                call.answer(myStream);
            });

        } catch (error) {
            console.error("حدث خطأ: ", error);
            alert("فشل بدء البث، تأكد من إعطاء الصلاحيات.");
        }
    }

    // 2. دالة المشاهدة (صديقك يضغط عليها)
    function connectToFriend() {
        const friendId = friendIdInput.value.trim();
        if (!friendId) {
            alert("يرجى إدخال الـ ID أولاً");
            return;
        }

        // إنشاء اتصال فارغ فقط لاستقبال البث
        navigator.mediaDevices.getUserMedia({ video: false, audio: true }).then((micStream) => {
            const call = peer.call(friendId, micStream);
            
            call.on('stream', (remoteStream) => {
                mainVideo.srcObject = remoteStream;
                mainVideo.play();
            });
        }).catch((err) => {
             // حتى لو لم يكن لدى صديقك مايك، يستطيع المشاهدة
             const fakeStream = new MediaStream(); 
             const call = peer.call(friendId, fakeStream);
             call.on('stream', (remoteStream) => {
                mainVideo.srcObject = remoteStream;
                mainVideo.play();
            });
        });
    }

    // 3. أداة التحكم بالمايكروفون
    function toggleMic() {
        if (myAudioTrack) {
            myAudioTrack.enabled = !myAudioTrack.enabled;
            if (myAudioTrack.enabled) {
                micBtn.innerText = "إيقاف المايك 🎤";
                micBtn.style.backgroundColor = "";
            } else {
                micBtn.innerText = "تشغيل المايك 🔇";
                micBtn.style.backgroundColor = "#ff9800";
            }
        }
    }
</script>
</body>
</html>
