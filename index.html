<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سينما الأصدقاء VIP</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #080808;
            --panel-bg: #141414;
            --text: #ffffff;
            --primary: #e50914;
            --success: #28a745;
            --border: #333;
        }
        body {
            margin: 0; padding: 10px; background: var(--bg-color); color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center;
        }
        .container { width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 15px; }
        .panel { background: var(--panel-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 15px; }
        button { padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1em; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-main { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-secondary { background: #444; color: white; }
        .btn-active { background: #fca311; color: black; }
        .btn-fullscreen { background: #2196F3; color: white; margin-top: 10px; }
        
        #roomUrlInput {
            width: 100%; padding: 12px; background: #000; color: var(--success);
            border: 1px solid var(--border); border-radius: 8px; margin-top: 15px;
            font-family: monospace; text-align: center; font-size: 1.1em; direction: ltr;
        }
        
        .video-wrapper {
            position: relative; width: 100%; background: #000; border-radius: 12px;
            overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column;
        }
        
        .video-container {
            position: relative; width: 100%; aspect-ratio: 16/9;
        }
        
        /* أزلنا الحظر عن الفيديو ليتمكن من التحكم به */
        video { width: 100%; height: 100%; object-fit: contain; }
        
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10; text-align: center; padding: 20px;
        }
        #audioContainer { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- لوحة المضيف -->
    <div class="panel" id="hostPanel" style="display:none;">
        <h2>🎬 غرفة التحكم (المضيف)</h2>
        <div id="hostStatus" style="color:#888;">جاري تجهيز الغرفة...</div>
        <input type="text" id="roomUrlInput" readonly onclick="this.select(); document.execCommand('copy'); alert('تم نسخ الرابط! أرسله لصديقك.');">
        
        <div class="controls">
            <button class="btn-main" id="startStreamBtn" onclick="startHostStream()">▶️ بدء بث الفيلم للغرفة</button>
            <button class="btn-secondary" id="hostMicBtn" onclick="toggleMic('host')" style="display:none;">🎤 إيقاف المايكروفون</button>
        </div>
    </div>

    <!-- لوحة المشاهد -->
    <div class="panel" id="viewerPanel" style="display:none;">
        <h2>🍿 سينما الأصدقاء</h2>
        <div class="controls">
            <button class="btn-active" id="viewerMicBtn" onclick="toggleMic('viewer')" style="display:none;">🎤 تشغيل مايكروفوني</button>
            <button class="btn-fullscreen" id="fullscreenBtn" onclick="toggleFullScreen()" style="display:none;">⛶ تكبير الشاشة</button>
        </div>
    </div>

    <!-- شاشة العرض -->
    <div class="video-wrapper" id="videoWrapper">
        <div class="video-container">
            <!-- شاشات التفاعل للمشاهد -->
            <div class="overlay" id="viewerJoinOverlay" style="display:none;">
                <h3 style="color: white; margin-bottom: 20px;">أهلاً بك في غرفة المشاهدة</h3>
                <button class="btn-success" onclick="viewerEnterRoom()" style="font-size: 1.2em; padding: 15px 30px;">الدخول للغرفة</button>
            </div>
            
            <div class="overlay" id="waitingHostOverlay" style="display:none;">
                <h3 style="color: #fca311;">في انتظار المضيف لبدء الفيلم...</h3>
                <p style="color: #aaa;">سيبدأ البث هنا تلقائياً</p>
            </div>
            
            <div class="overlay" id="forcePlayOverlay" style="display:none;">
                <h3 style="color: white;">البث يعمل الآن!</h3>
                <button class="btn-success" onclick="forcePlayVideo()">▶️ انقر للمشاهدة</button>
            </div>

            <!-- أضفنا controls ليتمكن من استخدام المشغل بشكل طبيعي -->
            <video id="mainVideo" playsinline autoplay controls></video>
        </div>
    </div>
</div>

<div id="audioContainer"></div>

<script>
    const peer = new Peer();
    const isHost = !window.location.hash; 
    
    let localStream = null;
    let localMicTrack = null;
    let connectedViewers = [];
    
    const mainVideo = document.getElementById('mainVideo');
    const hostPanel = document.getElementById('hostPanel');
    const viewerPanel = document.getElementById('viewerPanel');
    const audioContainer = document.getElementById('audioContainer');

    peer.on('open', (id) => {
        if (isHost) {
            hostPanel.style.display = 'block';
            document.getElementById('roomUrlInput').value = window.location.href + "#" + id;
            document.getElementById('roomUrlInput').style.display = 'block';
            document.getElementById('hostStatus').innerText = "الغرفة جاهزة. انسخ الرابط وأرسله لصديقك، ثم ابدأ البث.";
        } else {
            viewerPanel.style.display = 'block';
            document.getElementById('viewerJoinOverlay').style.display = 'flex';
        }
    });

    // ==========================================
    // إعدادات أحداث الشبكة (Peer Events)
    // ==========================================
    if (isHost) {
        peer.on('connection', (conn) => {
            if (!connectedViewers.includes(conn.peer)) {
                connectedViewers.push(conn.peer);
                if (localStream) {
                    peer.call(conn.peer, localStream);
                }
            }
        });

        // استلام المايكروفون من الضيف
        peer.on('call', (call) => {
            call.answer();
            call.on('stream', (remoteAudio) => {
                const audioEl = document.createElement('audio');
                audioEl.srcObject = remoteAudio;
                audioEl.autoplay = true;
                audioContainer.appendChild(audioEl);
            });
        });
    } else {
        peer.on('call', (call) => {
            call.answer();
            call.on('stream', (stream) => {
                document.getElementById('waitingHostOverlay').style.display = 'none';
                mainVideo.srcObject = stream;
                
                mainVideo.play().catch(err => {
                    document.getElementById('forcePlayOverlay').style.display = 'flex';
                });
            });
        });
    }

    // ==========================================
    // 1. دالة بدء البث للمضيف (مع تحسين جودة الصوت)
    // ==========================================
    async function startHostStream() {
        if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
            alert("⚠️ هام: يجب أن تفتح الموقع برابط يبدأ بـ HTTPS لكي يعمل البث.");
            return;
        }

        try {
            document.getElementById('hostStatus').innerText = "جاري التقاط الشاشة...";
            
            const displayStream = await navigator.mediaDevices.getDisplayMedia({
                video: true,
                audio: { echoCancellation: false, noiseSuppression: false } // منع الفلاتر
            });

            document.getElementById('hostStatus').innerText = "جاري التقاط المايكروفون...";

            const micStream = await navigator.mediaDevices.getUserMedia({ 
                audio: { echoCancellation: true, noiseSuppression: true },
                video: false
            });
            localMicTrack = micStream.getAudioTracks()[0];

            const audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
            const dest = audioContext.createMediaStreamDestination();
            
            if (displayStream.getAudioTracks().length > 0) {
                audioContext.createMediaStreamSource(displayStream).connect(dest);
            }
            audioContext.createMediaStreamSource(micStream).connect(dest);

            // السر الجديد: إخبار المتصفح أن هذا البث عبارة عن "موسيقى سينمائية" وليس مكالمة بشرية
            const mixedAudioTrack = dest.stream.getAudioTracks()[0];
            if ('contentHint' in mixedAudioTrack) {
                mixedAudioTrack.contentHint = 'music'; 
            }

            localStream = new MediaStream([
                displayStream.getVideoTracks()[0],
                mixedAudioTrack // استخدام المسار المُحسن
            ]);

            mainVideo.srcObject = localStream;
            mainVideo.muted = true;
            mainVideo.play();

            document.getElementById('hostStatus').innerText = "البث المباشر يعمل الآن 🔴";
            document.getElementById('hostStatus').style.color = "#e50914";
            document.getElementById('startStreamBtn').style.display = 'none';
            document.getElementById('hostMicBtn').style.display = 'block';

            connectedViewers.forEach(viewerId => {
                peer.call(viewerId, localStream);
            });

        } catch (error) {
            console.error(error);
            alert("فشل بدء البث. السبب: " + error.message);
            document.getElementById('hostStatus').innerText = "حدث خطأ. حاول مرة أخرى.";
        }
    }

    // ==========================================
    // 2. دوال المشاهد والشاشة الكاملة
    // ==========================================
    function viewerEnterRoom() {
        mainVideo.play().catch(() => {}); 
        
        document.getElementById('viewerJoinOverlay').style.display = 'none';
        document.getElementById('waitingHostOverlay').style.display = 'flex';
        document.getElementById('viewerMicBtn').style.display = 'block';
        document.getElementById('fullscreenBtn').style.display = 'block'; // إظهار زر التكبير

        const hostId = window.location.hash.substring(1);
        peer.connect(hostId);
    }

    function forcePlayVideo() {
        mainVideo.play();
        document.getElementById('forcePlayOverlay').style.display = 'none';
    }

    function toggleFullScreen() {
        const videoWrapper = document.getElementById('videoWrapper');
        if (!document.fullscreenElement) {
            if (videoWrapper.requestFullscreen) {
                videoWrapper.requestFullscreen();
            } else if (videoWrapper.webkitRequestFullscreen) { /* Safari */
                videoWrapper.webkitRequestFullscreen();
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) { /* Safari */
                document.webkitExitFullscreen();
            }
        }
    }

    // ==========================================
    // 3. أداة التحكم بالمايكروفون (التحرير الكامل للهاردوير)
    // ==========================================
    async function toggleMic(role) {
        const btn = role === 'host' ? document.getElementById('hostMicBtn') : document.getElementById('viewerMicBtn');
        
        try {
            if (!localMicTrack) {
                // التشغيل: نطلب صلاحية المايك من نظام التشغيل
                const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                localMicTrack = micStream.getAudioTracks()[0];
                
                if (role === 'viewer') {
                    const hostId = window.location.hash.substring(1);
                    peer.call(hostId, micStream);
                }
                
                btn.innerText = "🎤 إيقاف مايكروفوني";
                btn.className = "btn-secondary";
            } else {
                // الإيقاف الجذري: لا نقوم بكتمه فقط، بل نقتله لنخبر الأندرويد أن يخرج من وضع المكالمة
                localMicTrack.stop(); 
                localMicTrack = null; // تفريغه بالكامل
                
                btn.innerText = "🔇 تشغيل مايكروفوني";
                btn.className = "btn-active";
            }
        } catch (err) {
            alert("لا يمكن الوصول للمايكروفون. يرجى السماح للمتصفح باستخدام المايك.");
        }
    }
</script>
</body>
</html>
