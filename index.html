<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سينما الأصدقاء - بث نقي</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        :root { --bg-color: #080808; --panel-bg: #141414; --text: #ffffff; --primary: #e50914; --success: #28a745; --border: #333; }
        body { margin: 0; padding: 10px; background: var(--bg-color); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 15px; }
        .panel { background: var(--panel-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 15px; }
        button { padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1em; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-main { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-fullscreen { background: #2196F3; color: white; }
        
        #roomUrlInput {
            width: 100%; padding: 12px; background: #000; color: var(--success); border: 1px solid var(--border);
            border-radius: 8px; margin-top: 15px; font-family: monospace; text-align: center; font-size: 1.1em; direction: ltr;
        }
        
        .video-wrapper { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; }
        .video-container { position: relative; width: 100%; aspect-ratio: 16/9; }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; text-align: center; padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- لوحة المضيف -->
    <div class="panel" id="hostPanel" style="display:none;">
        <h2>🎬 غرفة التحكم (المضيف)</h2>
        <div id="hostStatus" style="color:#888;">جاري تجهيز الغرفة...</div>
        <input type="text" id="roomUrlInput" readonly onclick="this.select(); document.execCommand('copy'); alert('تم نسخ الرابط! أرسله لصديقك.');">
        
        <div class="controls">
            <button class="btn-main" id="startStreamBtn" onclick="startHostStream()">▶️ بدء بث الفيلم للغرفة</button>
        </div>
    </div>

    <!-- لوحة المشاهد -->
    <div class="panel" id="viewerPanel" style="display:none;">
        <h2>🍿 سينما الأصدقاء</h2>
        <div class="controls">
            <button class="btn-fullscreen" id="fullscreenBtn" onclick="toggleFullScreen()" style="display:none;">⛶ ملء الشاشة</button>
        </div>
    </div>

    <!-- شاشة العرض -->
    <div class="video-wrapper" id="videoWrapper">
        <div class="video-container">
            <div class="overlay" id="viewerJoinOverlay" style="display:none;">
                <h3 style="color: white; margin-bottom: 20px;">أهلاً بك في غرفة المشاهدة</h3>
                <button class="btn-success" onclick="viewerEnterRoom()" style="font-size: 1.2em; padding: 15px 30px;">الدخول للغرفة</button>
            </div>
            
            <div class="overlay" id="waitingHostOverlay" style="display:none;">
                <h3 style="color: #fca311;">في انتظار المضيف لبدء الفيلم...</h3>
            </div>
            
            <div class="overlay" id="forcePlayOverlay" style="display:none;">
                <h3 style="color: white;">البث يعمل الآن!</h3>
                <button class="btn-success" onclick="forcePlayVideo()">▶️ انقر للمشاهدة</button>
            </div>

            <!-- مشغل فيديو بكامل ميزاته للمشاهد -->
            <video id="mainVideo" playsinline autoplay controls></video>
        </div>
    </div>
</div>

<script>
    const peer = new Peer();
    const isHost = !window.location.hash; 
    let localStream = null;
    let connectedViewers = [];
    
    const mainVideo = document.getElementById('mainVideo');
    const hostPanel = document.getElementById('hostPanel');
    const viewerPanel = document.getElementById('viewerPanel');

    peer.on('open', (id) => {
        if (isHost) {
            hostPanel.style.display = 'block';
            document.getElementById('roomUrlInput').value = window.location.href + "#" + id;
            document.getElementById('roomUrlInput').style.display = 'block';
            document.getElementById('hostStatus').innerText = "الغرفة جاهزة. انسخ الرابط وأرسله لصديقك، ثم ابدأ البث.";
        } else {
            viewerPanel.style.display = 'block';
            document.getElementById('viewerJoinOverlay').style.display = 'flex';
        }
    });

    // ==========================================
    // 1. المضيف (بث الشاشة والصوت الخالص)
    // ==========================================
    if (isHost) {
        peer.on('connection', (conn) => {
            if (!connectedViewers.includes(conn.peer)) {
                connectedViewers.push(conn.peer);
                if (localStream) peer.call(conn.peer, localStream);
            }
        });
    }

    async function startHostStream() {
        if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
            alert("⚠️ هام: يجب أن تفتح الموقع برابط يبدأ بـ HTTPS."); return;
        }

        try {
            document.getElementById('hostStatus').innerText = "جاري التقاط الشاشة...";
            
            // سحب مباشر لنتفليكس بدون أي تعديلات أو فلاتر
            localStream = await navigator.mediaDevices.getDisplayMedia({
                video: true,
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
            });

            if (localStream.getAudioTracks().length === 0) {
                alert("⚠️ تنبيه: لم تقم بتفعيل 'مشاركة الصوت' (Share tab audio)!");
            }

            mainVideo.srcObject = localStream;
            mainVideo.muted = true; // كتم الصوت عندك فقط
            mainVideo.play();

            document.getElementById('hostStatus').innerText = "البث المباشر يعمل الآن 🔴";
            document.getElementById('hostStatus').style.color = "#e50914";
            document.getElementById('startStreamBtn').style.display = 'none';

            connectedViewers.forEach(viewerId => peer.call(viewerId, localStream));

        } catch (error) {
            console.error(error);
            alert("فشل بدء البث. السبب: " + error.message);
        }
    }

    // ==========================================
    // 2. المشاهد (استقبال البث كفيلم طبيعي)
    // ==========================================
    function viewerEnterRoom() {
        mainVideo.play().catch(() => {}); 
        document.getElementById('viewerJoinOverlay').style.display = 'none';
        document.getElementById('waitingHostOverlay').style.display = 'flex';
        document.getElementById('fullscreenBtn').style.display = 'block'; 

        const hostId = window.location.hash.substring(1);
        peer.connect(hostId);
    }

    if (!isHost) {
        peer.on('call', (call) => {
            call.answer(); // استلام البث بدون إرسال مايكروفون
            call.on('stream', (stream) => {
                document.getElementById('waitingHostOverlay').style.display = 'none';
                mainVideo.srcObject = stream;
                
                mainVideo.play().catch(err => {
                    document.getElementById('forcePlayOverlay').style.display = 'flex';
                });
            });
        });
    }

    function forcePlayVideo() {
        mainVideo.play();
        document.getElementById('forcePlayOverlay').style.display = 'none';
    }

    // ==========================================
    // 3. تكبير الشاشة
    // ==========================================
    function toggleFullScreen() {
        const videoWrapper = document.getElementById('videoWrapper');
        if (!document.fullscreenElement) {
            if (videoWrapper.requestFullscreen) videoWrapper.requestFullscreen();
            else if (videoWrapper.webkitRequestFullscreen) videoWrapper.webkitRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
    }
</script>
</body>
</html>
